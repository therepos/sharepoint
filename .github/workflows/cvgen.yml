name: cvgen build

on:
  push:
    branches:
      - main
    paths:
      - 'cvgen/**'
      - '.github/workflows/cvgen.yml'
  pull_request:
    paths:
      - 'cvgen/**'
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: img
        run: echo "name=$(echo ghcr.io/${{ github.repository_owner }}/cvgen | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set version
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          COUNT=$(git rev-list --count HEAD -- cvgen/ .github/workflows/cvgen.yml)
          echo "VERSION=${DATE}.${COUNT}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cvgen
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
