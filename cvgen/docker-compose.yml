services:
  cvgen:
    image: ghcr.io/therepos/cvgen:latest
    container_name: cvgen
    restart: unless-stopped
    ports:
      - "3029:8501"
    volumes:
      - /mnt/sec/apps/cvgen/data:/app/data
      - /mnt/sec/apps/cvgen/config:/app/config
      - /mnt/sec/apps/cvgen/templates:/app/templates
    environment:
      - CVGEN_USERNAME=${CVGEN_USERNAME:-admin}
      - CVGEN_PASSWORD=${CVGEN_PASSWORD}
      - TZ=Asia/Singapore
    # Required so asyncio's socket.socketpair() (used by Streamlit/tornado)
    # is not blocked by the host seccomp/AppArmor profile — typical on
    # unprivileged Proxmox LXC and hardened Docker hosts.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
